<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkpoint</title>
  <link rel="stylesheet" href="/style.css">
  <script type="importmap">
    { "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/addons/" } }
  </script>
</head>
<body>
  <div id="booth"></div>
  <main id="panel">
  <header>
    <h1>Checkpoint</h1>
    <p id="status">Connecting…</p>
    <p><span id="clock"></span> <span id="queue-position"></span></p>
  </header>

  <section id="start-screen">
    <p>You're the inspector. Question each traveller out loud, then stamp them through or turn them away.</p>
    <button id="start" type="button">Start shift</button>
  </section>

  <section id="desk" hidden>
    <p id="last-stamp"></p>
    <h2 id="traveller-name"></h2>
    <dl id="papers"></dl>
    <h3>Scratchpad</h3>
    <ul id="notes"></ul>
    <p id="questions-left"></p>
    <ol id="conversation"></ol>
    <p><button id="talk" type="button" hidden>Hold to talk (or hold Space)</button></p>
    <form id="ask-form">
      <input id="question" type="text" maxlength="300" autocomplete="off" placeholder="Or type a question">
      <button id="ask" type="submit">Ask</button>
    </form>
    <p>
      <button id="stamp-through" type="button">Stamp: through</button>
      <button id="stamp-away" type="button">Stamp: turned away</button>
    </p>
    <p id="hint" role="status"></p>
  </section>

  <section id="report" hidden>
    <h2>End of shift</h2>
    <p id="end-reason"></p>
    <table>
      <thead><tr><th>Traveller</th><th>Your stamp</th><th>The truth</th><th>Result</th></tr></thead>
      <tbody id="report-rows"></tbody>
    </table>
    <p id="score"></p>
    <button id="again" type="button">Play again</button>
  </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
